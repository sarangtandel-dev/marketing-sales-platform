name: Install gitleaks
description: Download a pinned gitleaks release, verify its checksum, and put it on PATH.
inputs:
  version:
    description: gitleaks version, without the leading v
    default: 8.30.1
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
        tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
        curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
        curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${VERSION}_checksums.txt"
        (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
        tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
        sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/
