# Weekly update PRs, grouped so there's one per ecosystem. Nothing younger than a week is
# proposed (on top of pnpm's one-day minimumReleaseAge): a hijacked release is usually
# caught and pulled within that time. Actions stay pinned to commit SHAs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
