name: Deploy

# Builds every Client and uploads each to its own Pages project (one project per Client,
# named by its slug; ADR-0003). Every branch, including main, deploys as a preview: the
# projects' production branch is `live`, which only the launch (ticket 36) deploys to.
# Previews are noindex.
#
# Two jobs, so the Cloudflare token never sits next to the build: `build` runs the
# workspace's dependencies without it; `deploy` holds it and installs only wrangler.
# `live` must also pass the tests and every Client's launch check, and deploys through
# the `production` environment (set a required reviewer on it in the repo settings).
#
# The Cloudflare token lives only in the `preview` and `production` environments' secrets,
# never as a repository secret. Restrict `production` to the `live` branch. The variable
# DEPLOY_ENABLED=true switches deploys on.
# ponytail: a Pages token can't be limited to preview branches, so anyone with write access
# to the repo could still publish production through a preview run. Fine while every writer
# is also the reviewer; upgrade path: a separate Cloudflare account for previews.

on:
  push:
    # Branches only: a tag named `live` must never take the production path.
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # A newer push supersedes a preview still in progress; a production deploy always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/live' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.cloudflare.outputs.enabled }}
    steps:
      - name: Check deploys are switched on
        id: cloudflare
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          echo "enabled=$DEPLOY_ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "::notice::The DEPLOY_ENABLED variable isn't true, so nothing is deployed. See docs/development.md."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.cloudflare.outputs.enabled == 'true'
      # No dependency cache in a deploying workflow: a poisoned cache could ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          node-version: 24
      - if: steps.cloudflare.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Production gate (tests and every Client's launch check)
        if: steps.cloudflare.outputs.enabled == 'true' && github.ref == 'refs/heads/live'
        run: |
          pnpm test
          for dir in clients/*/; do
            [ -f "$dir/site/site-definition.json" ] || continue
            pnpm check:launch "$dir"
          done
      - name: Build every Client
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          IS_LIVE: ${{ github.ref == 'refs/heads/live' }}
          # The preview form Worker (wrangler.jsonc env "preview"). Unset: preview forms post
          # to an address that doesn't exist, never to the production Worker.
          PREVIEW_FORM_ENDPOINT: ${{ vars.PREVIEW_FORM_ENDPOINT || 'https://preview-form-worker-not-configured.invalid/lead' }}
        run: |
          # Only the production branch builds for production. Every other branch is a preview:
          # Turnstile's test key and the preview Worker, so QA Leads never reach production (ADR-0028).
          if [ "$IS_LIVE" = "true" ]; then
            mode=()
          else
            mode=(--preview --form-endpoint "$PREVIEW_FORM_ENDPOINT")
          fi
          # ponytail: every Client rebuilds on every push (cheap while there are few). Upgrade
          # path: diff against the last successful deploy once builds get slow.
          # One Client's broken build never stops the others; the deploy job fails at the end.
          mkdir -p dist
          for dir in clients/*/; do
            client=$(basename "$dir")
            [ -f "$dir/site/site-definition.json" ] || continue
            pnpm build:site "$dir/site" "dist/$client" "${mode[@]}" || echo "$client" >> dist/build-failures.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          name: sites
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/live' && 'production' || 'preview' }}
    steps:
      # Records every outbound connection while the Cloudflare token is present.
      # ponytail: audit mode; switch to egress-policy: block with an allow-list once the
      # audit shows the endpoints wrangler needs.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The root package only (wrangler), from the lockfile: none of the build's dependencies.
      - run: pnpm install --frozen-lockfile --filter marketing-sales-platform
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sites
          path: dist
      - name: Deploy each Client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # The artifact comes from a job that ran third-party build code, so it decides nothing:
          # the Clients come from this job's own checkout, and anything else in the artifact,
          # or any server-side code (Pages Functions), stops the deploy.
          clients=()
          for d in clients/*/; do [ -f "$d/site/site-definition.json" ] && clients+=("$(basename "$d")"); done
          for entry in dist/*; do
            name=$(basename "$entry")
            [ "$name" = "build-failures.txt" ] && continue
            printf '%s\n' "${clients[@]}" | grep -qx "$name" || { echo "::error::Unexpected artifact entry: $name"; exit 1; }
          done
          if find dist -mindepth 2 -maxdepth 2 \( -name _worker.js -o -name functions \) | grep -q .; then
            echo "::error::A build contains _worker.js or functions/; static sites only"
            exit 1
          fi
          failed=$(cat dist/build-failures.txt 2>/dev/null | xargs)
          for client in "${clients[@]}"; do
            [ -d "dist/$client" ] || continue
            pnpm exec wrangler pages deploy "dist/$client" --project-name="$client" --branch="$BRANCH" --commit-dirty=true \
              || failed="$failed $client"
          done
          if [ -n "$failed" ]; then
            echo "::error::Not deployed:$failed"
            exit 1
          fi
