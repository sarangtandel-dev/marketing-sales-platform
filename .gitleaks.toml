# Secrets scan config: gitleaks' default rules, plus an allow-list for
# Cloudflare Turnstile's published test keys (used on preview, ADR-0028).
title = "marketing-sales-platform"

[extend]
useDefault = true

[[allowlists]]
description = "Cloudflare Turnstile published test site keys and secret keys"
regexTarget = "match"
regexes = [
  '''[123]x0{20}(AA|AB|BB|FF)''',
  '''[123]x0{31}AA''',
]
